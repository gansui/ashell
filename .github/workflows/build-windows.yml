name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: ["build/windows-x64"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]*)"' | % { $_.Matches.Groups[1].Value } | Select-Object -First 1)
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $basename = "ashell-v${version}-dev.${sha}-windows-x64"
          $bin = "target\x86_64-pc-windows-msvc\release\ashell.exe"

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item $bin "dist\${basename}\ashell.exe"
          Compress-Archive -Path "dist\${basename}" -DestinationPath "dist\${basename}-portable.zip"
          Remove-Item -Recurse "dist\${basename}"
          Get-FileHash -Algorithm SHA256 "dist\*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
