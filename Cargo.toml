[package]
name = "ashell"
version = "0.5.2-fix1"
edition = "2024"
authors = ["ashell contributors"]
description = "A GPUI Component based SSH and local terminal client"
license = "GPL-3.0-or-later"
rust-version = "1.85.0"

[dependencies]
anyhow = "1"
rdp = { path = "rdp-rs", package = "rdp-rs" }
tokio-socks = "0.5"
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "5"
encoding_rs = "0.8"
flate2 = "1"
gpui = { git = "https://github.com/gansui/zed", rev = "93801c3465cf61adc05022e0ea1ae61c42e73275" }
gpui_platform = { git = "https://github.com/gansui/zed", rev = "93801c3465cf61adc05022e0ea1ae61c42e73275", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/gansui/gpui-kit", rev = "7bc52a726b72d1885d30124e534e3d686c547967" }
gpui-component-assets = { git = "https://github.com/gansui/gpui-kit", rev = "7bc52a726b72d1885d30124e534e3d686c547967" }
menu = { git = "https://github.com/gansui/zed", rev = "93801c3465cf61adc05022e0ea1ae61c42e73275" }
portable-pty = "0.8"
rfd = "0.15"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
rust-i18n = "3"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = "0.6"
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
futures = "0.3.32"
open = "5.1"
time = { version = "0.3.45", features = ["formatting", "local-offset"] }
tracing-appender = "0.2.5"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
hmac = "0.12"
hex = "0.4"
serialport = "4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
winrt-notification = { package = "tauri-winrt-notification", version = "=0.2.1" }
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
] }
winreg = "0.52"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
desktop-notify = { package = "notify-rust", version = "=4.11.5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSDockTile"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSUserNotification"] }

[package.metadata.deb]
maintainer = "ashell contributors"
license-file = ["LICENSE"]
extended-description = "A GPUI Component based SSH and local terminal client"
section = "terminal"
priority = "optional"
assets = [
    ["target/release/ashell", "usr/bin/", "755"],
    ["assets/ashell.desktop", "usr/share/applications/", "644"],
    ["assets/icons/ashell.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"

# Remove these overrides after GPUI moves off block 0.1 and stacksafe 0.1.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
stacksafe-macro = { path = "patches/stacksafe-macro" }

[lints.cargo]
# `menu` (a gpui git dependency), `winres` (a build-dependency) and
# `desktop-notify` (a dash-aliased crate used as `desktop_notify`) are all
# actually referenced; cargo's `unused_dependencies` lint misreports them
# (git deps, build deps and dash-aliased crates), so silence it here instead
# of deleting dependencies that are genuinely used.
unused_dependencies = "allow"
